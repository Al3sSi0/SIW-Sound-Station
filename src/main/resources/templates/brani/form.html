<!DOCTYPE html>
<html>

<head>
	<title>Inserimento nuovo brano</title>
</head>

<body>
	<form method="POST" th:action="@{/brani}" th:object="${brano}">
		<div>
			NOME:
			<input type="text" th:field="*{nome}" />
			<span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
		</div>
		<div>
			ANNO:
			<input type="text" th:field="*{anno}" />
			<span th:if="${#fields.hasErrors('anno')}" th:errors="*{anno}"></span>
		</div>
		<div>
			GENERE:
			<input type="text" th:field="*{genere}" />
			<span th:if="${#fields.hasErrors('genere')}" th:errors="*{genere}"></span>
		</div>
		<div>
			IMMAGINE URL':
			<input type="text" th:field="*{imgUrl}" />
			<span th:if="${#fields.hasErrors('imgUrl')}" th:errors="*{imgUrl}"></span>
		</div>
		<div>
			<label>Durata:</label>

			<select th:field="*{minuti}">
				<option th:each="m : ${#numbers.sequence(0, 15)}" th:value="${m}" th:text="${m} + ' min'"></option>
			</select>

			<select th:field="*{secondi}">
				<option th:each="s : ${#numbers.sequence(0, 59)}" th:value="${s}"
					th:text="${#numbers.formatInteger(s, 2)} + ' sec'"></option>
			</select>
		</div>
		<div>
			AUTORE:
			<div>
				<select th:field="*{autore}">
					<option value="">--SCEGLI ARTISTA--</option>
					<option th:each="artista : ${artisti}" th:value="${artista.id}" th:text="${artista.nome}">Eminem
					</option>
				</select>
			</div>
		</div>
		<div>
			
			SELEZIONA ARTISTI FEATURING:
			<div th:if="${artisti != null and !#lists.isEmpty(artisti)}">
				<div th:each="artista : ${artisti}">
					<input type="checkbox" name="artistiIds" th:value="${artista.id}"
						th:id="'artista-' + ${artista.id}" />
					<label th:for="'artista-' + ${artista.id}" th:text="${artista.nome}">Eminem</label>
				</div>
			</div>
			<span th:if="${artisti == null or #lists.isEmpty(artisti)}">Non ci sono artisti disponibili nel
				sistema!</span>
				<span th:if="${#fields.hasErrors('featuring')}" th:errors="*{featuring}" style="color: red; font-weight: bold;"></span>
		</div>

		<button type="submit">INSERISCI</button>
		</div>
	</form>
</body>

</html>
